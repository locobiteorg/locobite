name: locobite
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  dotted_border: ^2.1.0
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/locobite.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/locobite.png